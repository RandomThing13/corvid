[project]
name = "stoa"
version = "0.1.0"
description = "Local native PDF development evidence slice"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pymupdf>=1.24,<2",
  "pillow>=11,<13",
  "uvicorn>=0.34,<1",
  "openai>=3.51.0",
  "python-dotenv>=1.2.4",
  "python-multipart>=0.0.33",
  "shapely==2.2.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.uv]
package = false
no-build = true
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
